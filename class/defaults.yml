parameters:
  cert_exoscale:
    =_metadata:
      deprecated: true
      replaced_by: cert-manager
      deprecation_notice: >-
        The functionality of this component has been moved to the cert-manager component.
        See https://hub.syn.tools/cert-manager/references/parameters.html#_component_exoscale_webhook

    namespace: syn-cert-manager

    manifestVersion: v${cert_exoscale:images:webhook:tag}
    kustomizeInput:
      namespace: ${cert_exoscale:namespace}

    images:
      webhook:
        registry: docker.io
        repository: exoscale/cert-manager-webhook-exoscale
        tag: 0.3.2

    secret:
      accessKey: '?{vaultkv:${cluster:tenant}/${cluster:name}/exoscale/cert_webhook/s3_access_key}'
      secretKey: '?{vaultkv:${cluster:tenant}/${cluster:name}/exoscale/cert_webhook/s3_secret_key}'
